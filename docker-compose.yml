name: ai-profit-monitor

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_profit_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_DB: ${POSTGRES_DB:-ai_profit_monitor}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:

