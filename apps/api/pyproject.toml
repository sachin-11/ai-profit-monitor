[project]
name = "ai-profit-monitor-api"
version = "0.1.0"
description = "Backend foundation for AI Profit Monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "asyncpg==0.30.0",
    "email-validator==2.3.0",
    "fastapi==0.116.1",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

